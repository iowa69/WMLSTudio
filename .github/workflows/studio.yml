name: Native WMLSTudio

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Test and freeze (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0
      - name: Install locked application and build dependencies
        run: uv sync --locked --group dev
      - name: Stage pinned reference data
        run: uv run python studio_scripts/stage_schemes.py --download
      - name: Preserve dependency license texts
        run: uv run python studio_packaging/stage_notices.py
      - name: Lint
        run: uv run ruff check src/wmlstudio studio_scripts studio_packaging studio_tests
      - name: Scientific and native UI tests
        run: uv run pytest --junitxml=artifacts/pytest.xml
      - name: Freeze native desktop and console companion
        run: uv run pyinstaller --noconfirm studio_packaging/wmlstudio.spec
      - name: Frozen reference typing and native desktop
        run: uv run python studio_packaging/check_frozen.py dist/WMLSTudio --output artifacts/frozen-check.json
      - name: Archive portable Linux build
        if: runner.os == 'Linux'
        run: |
          tar -czf dist/WMLSTudio-Linux-x64.tar.gz -C dist WMLSTudio
      - name: Archive portable Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/WMLSTudio -DestinationPath dist/WMLSTudio-Windows-x64.zip
          Get-FileHash -Algorithm SHA256 dist/WMLSTudio-Windows-x64.zip | Format-List | Out-File dist/windows-sha256.txt
      - name: Attach validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-validation-${{ runner.os }}
          path: artifacts/
          if-no-files-found: warn
      - name: Attach portable development build
        uses: actions/upload-artifact@v4
        with:
          name: WMLSTudio-${{ runner.os }}-x64
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*sha256.txt
          if-no-files-found: error
