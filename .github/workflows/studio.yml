name: Native WMLSTudio

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skesa:
    uses: ./.github/workflows/skesa-windows.yml
  ska:
    uses: ./.github/workflows/ska-windows.yml
  native:
    needs: [skesa, ska]
    name: Test and freeze (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      WMLSTUDIO_TEST_BLAST_DIR: ${{ github.workspace }}/src/wmlstudio/resources/tools/blast/bin
      WMLSTUDIO_TEST_FASTQC_ROOT: ${{ github.workspace }}/src/wmlstudio/resources/tools/fastqc
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0 libfontconfig1 fonts-dejavu-core
      - name: Install locked application and build dependencies
        run: uv sync --locked --group dev
      - name: Expose installed Windows fonts to headless Qt
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "QT_QPA_FONTDIR=$($env:SystemRoot -replace '\\', '/')/Fonts" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify readable headless Windows UI fonts
        if: runner.os == 'Windows'
        run: uv run python studio_packaging/check_qt_fonts.py --output artifacts/windows-qt-fonts.json
      - name: Stage pinned reference data
        run: uv run python studio_scripts/stage_schemes.py --download
      - name: Stage pinned characterization references
        run: uv run python studio_scripts/stage_characterization.py
      - name: Download verified native Windows SKA2
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: SKA2-0.5.1-Windows-x64
          path: artifacts/ska2-windows
      - name: Stage verified Windows SKA2 with source and notices
        if: runner.os == 'Windows'
        run: uv run python studio_packaging/stage_ska.py --platform windows-x64 --source artifacts/ska2-windows
      - name: Stage original pinned Linux SKA2
        if: runner.os == 'Linux'
        run: uv run python studio_packaging/stage_ska.py --platform linux-x64
      - name: Stage original FastQC and private Windows Java with sources and notices
        if: runner.os == 'Windows'
        run: uv run python studio_packaging/stage_fastqc.py --platform windows-x64
      - name: Stage original FastQC and private Linux Java with sources and notices
        if: runner.os == 'Linux'
        run: uv run python studio_packaging/stage_fastqc.py --platform linux-x64
      - name: Stage pinned native BLAST for Windows
        if: runner.os == 'Windows'
        run: uv run python studio_packaging/stage_bio_tools.py --platform windows-x64 --download-hydra-starter
      - name: Stage pinned native BLAST for Linux
        if: runner.os == 'Linux'
        run: uv run python studio_packaging/stage_bio_tools.py --platform linux-x64 --download-hydra-starter
      - name: Download verified native Windows assembler
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: SKESA-2.4.0-Windows-x64
          path: src/wmlstudio/resources/tools/skesa
      - name: Verify required Windows assembler and corresponding sources
        if: runner.os == 'Windows'
        run: uv run python studio_packaging/stage_bio_tools.py --platform windows-x64 --require-skesa
      - name: Preserve dependency license texts
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python studio_packaging/stage_notices.py
      - name: Lint
        run: uv run ruff check src/wmlstudio studio_scripts studio_packaging studio_tests
      - name: Scientific and native UI tests
        run: uv run pytest --junitxml=artifacts/pytest.xml
      - name: Freeze native desktop and console companion
        run: uv run pyinstaller --noconfirm studio_packaging/wmlstudio.spec
      - name: Verify app-local Windows DLL closure without runner redistributables
        if: runner.os == 'Windows'
        run: uv run python studio_packaging/audit_windows_runtime.py dist/WMLSTudio --output artifacts/windows-runtime-closure.json
      - name: Frozen reference typing and native desktop
        run: uv run python studio_packaging/check_frozen.py dist/WMLSTudio --output artifacts/frozen-check.json
      - name: Independently probe bundled Windows CDS modules without installed-wheel fallback
        if: runner.os == 'Windows'
        run: uv run python studio_packaging/check_bundled_cds.py dist/WMLSTudio --output artifacts/bundled-cds.json
      - name: Archive portable Linux build
        if: runner.os == 'Linux'
        run: |
          tar -czf dist/WMLSTudio-Linux-x64.tar.gz -C dist WMLSTudio
      - name: Archive portable Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/WMLSTudio -DestinationPath dist/WMLSTudio-Windows-x64.zip
          Get-FileHash -Algorithm SHA256 dist/WMLSTudio-Windows-x64.zip | Format-List | Out-File dist/windows-sha256.txt
      - name: Attach validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-validation-${{ runner.os }}
          path: artifacts/
          if-no-files-found: warn
      - name: Attach portable development build
        uses: actions/upload-artifact@v4
        with:
          name: WMLSTudio-${{ runner.os }}-x64
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*sha256.txt
          if-no-files-found: error
