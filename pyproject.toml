[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "wmlstudio"
version = "0.2.0"
description = "Native desktop workspace for bacterial sequence typing"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "PySide6-Essentials>=6.8,<7",
    "hydra-amr",
    "pyahocorasick>=2.1,<3",
    "pyrodigal>=3.6,<4",
]

[project.gui-scripts]
wmlstudio = "wmlstudio.app:main"

[project.scripts]
wmlstudio-cli = "wmlstudio.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "pytest-cov>=6,<8", "ruff>=0.11,<1", "pyinstaller>=6.12,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/wmlstudio"]

[tool.pytest.ini_options]
testpaths = ["studio_tests"]
qt_api = "pyside6"
addopts = "-ra --strict-markers"
markers = ["realdata: opt-in tests on local sequence inputs"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv.sources]
hydra-amr = { git = "https://github.com/iowa69/hydra", rev = "6d36c109491c16544e8919fe6962b4b62e97d3d7" }
